services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-fintrack}'
      - 'POSTGRES_USER=${POSTGRES_USER:-fintrack}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fintrack}'
    ports:
      - '5432:5432'
    volumes:
      - 'fintrack-postgres-data:/var/lib/postgresql/data'
      - './docker/postgres/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fintrack} -d ${POSTGRES_DB:-fintrack}']
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: 'quay.io/keycloak/keycloak:26.0'
    command: ['start-dev', '--import-realm']
    environment:
      - 'KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}'
      - 'KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}'
      - 'KC_DB=postgres'
      - 'KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak'
      - 'KC_DB_USERNAME=${POSTGRES_USER:-fintrack}'
      - 'KC_DB_PASSWORD=${POSTGRES_PASSWORD:-fintrack}'
      - 'KC_HEALTH_ENABLED=true'
      # Substituted into realm-export.json at import time to scope the client's
      # redirect URIs and web origins to the Angular app.
      - 'FINTRACK_UI_ORIGIN=${FINTRACK_UI_ORIGIN:-http://localhost:4200}'
    ports:
      - '8081:8080'
    volumes:
      - './docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; if [ $? -eq 0 ]; then exit 0; else exit 1; fi"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  api:
    build:
      context: .
      target: dev
    profiles: ['api']
    environment:
      - 'DB_HOST=postgres'
      - 'DB_PORT=5432'
      - 'POSTGRES_DB=${POSTGRES_DB:-fintrack}'
      - 'POSTGRES_USER=${POSTGRES_USER:-fintrack}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fintrack}'
      - 'KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/fintrack'
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  fintrack-postgres-data:
