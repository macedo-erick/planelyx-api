services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-planelyx}'
      - 'POSTGRES_USER=${POSTGRES_USER:-planelyx}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-planelyx}'
    ports:
      - '5432:5432'
    volumes:
      - 'planelyx-postgres-data:/var/lib/postgresql/data'
      - './docker/postgres/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql'
      # Runs only against an empty data directory, so it covers a fresh stack and nothing else.
      # The ocr service creates this database itself when it is missing, which is what makes an
      # existing volume work without `docker compose down -v`.
      - './docker/postgres/init-ocr-db.sql:/docker-entrypoint-initdb.d/init-ocr-db.sql'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-planelyx} -d ${POSTGRES_DB:-planelyx}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Built from the sibling repo rather than pulled from Docker Hub, so local dev runs the same
  # Keycloak production does: same realm, same login theme, same provisioning event listener.
  # This repo deliberately holds no Keycloak configuration of its own — it used to hold a second
  # copy of the realm and theme, and the two drifted.
  #
  # Requires planelyx-auth checked out beside planelyx-api. The first `up` builds it, which
  # includes compiling the event listener; after that it is cached.
  keycloak:
    build:
      context: ../planelyx-auth
    command: ['start-dev', '--import-realm']
    environment:
      - 'KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN:-admin}'
      - 'KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}'
      - 'KC_DB=postgres'
      - 'KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak'
      - 'KC_DB_USERNAME=${POSTGRES_USER:-planelyx}'
      - 'KC_DB_PASSWORD=${POSTGRES_PASSWORD:-planelyx}'
      - 'KC_HEALTH_ENABLED=true'
      # Baked into the auth image, but repeated here because `start-dev` re-runs augmentation and
      # an unset build option falls back to its default. Losing /auth would move the issuer out
      # from under the path the API validates against, which reads as a broken key rather than a
      # broken URL. KC_HTTP_MANAGEMENT_RELATIVE_PATH keeps the health probe off that prefix.
      - 'KC_HTTP_RELATIVE_PATH=/auth'
      - 'KC_HTTP_MANAGEMENT_RELATIVE_PATH=/'
      - 'PLANELYX_UI_ORIGIN=${PLANELYX_UI_ORIGIN:-http://localhost:4200}'
      - 'PLANELYX_UI_BASE_URL=${PLANELYX_UI_BASE_URL:-http://localhost:4200}'
      - 'PLANELYX_KEYCLOAK_ADMIN_CLIENT_SECRET=${PLANELYX_KEYCLOAK_ADMIN_CLIENT_SECRET:-local-dev-secret}'
      # Where the provisioning listener posts once a user registers. This file holds the API's
      # dependencies, not the API — that runs on the host from the IDE — so Keycloak reaches it
      # through the bridge gateway rather than by service name.
      - 'PLANELYX_PROVISIONING_URL=${PLANELYX_PROVISIONING_URL:-http://host.docker.internal:8080/internal/keycloak/user-registered}'
      - 'PLANELYX_PROVISIONING_SECRET=${PLANELYX_PROVISIONING_SECRET:-local-dev-secret}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '8081:8080'
    volumes:
      # The same files the image already contains, mounted only so realm and theme edits show up
      # without a rebuild. start-dev disables theme caching, so a refresh is enough. Not a second
      # copy: both paths point into planelyx-auth.
      - '../planelyx-auth/realm/realm-export.json:/opt/keycloak/data/import/realm-export.json'
      - '../planelyx-auth/themes/planelyx:/opt/keycloak/themes/planelyx'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; if [ $? -eq 0 ]; then exit 0; else exit 1; fi"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Built from the sibling repo, on the same reasoning as keycloak above: the review screen in the
  # UI talks to this service, so a stack without it has a page that only 404s.
  #
  # Requires planelyx-ocr checked out beside planelyx-api.
  ocr:
    build:
      context: ../planelyx-ocr
      target: dev
    environment:
      - 'DB_HOST=postgres'
      - 'DB_PORT=5432'
      # Its own database on the shared server, created by docker/postgres/init-ocr-db.sql.
      - 'POSTGRES_DB=planelyx_ocr'
      - 'POSTGRES_USER=${POSTGRES_USER:-planelyx}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-planelyx}'
      # The issuer is compared against the token's `iss` claim byte for byte, and a browser gets
      # its token from Keycloak on localhost:8081 — so that is what the claim says. The JWKS URL
      # is fetched rather than compared, and "localhost" inside a container is the container
      # itself, so the keys are read over the Compose network instead. The two differ on purpose.
      - 'KEYCLOAK_ISSUER_URI=http://localhost:8081/auth/realms/planelyx'
      - 'KEYCLOAK_JWKS_URI=http://keycloak:8080/auth/realms/planelyx/protocol/openid-connect/certs'
      # Confirmed transactions are written here. The API runs on the host, the same arrangement
      # keycloak's provisioning callback above assumes.
      - 'PLANELYX_API_URL=${PLANELYX_API_URL:-http://host.docker.internal:8080/api}'
      # The UI dev server is a different origin locally. In production nginx serves both under one
      # host and no cross-origin request is made at all.
      - 'OCR_CORS_ORIGINS=${PLANELYX_UI_ORIGIN:-http://localhost:4200}'
      # Binds all interfaces because the container boundary is what limits exposure here; the
      # published port below is loopback-only. The config default of 127.0.0.1 is right for a
      # bare-metal run, where nothing else is in the way.
      - 'HTTP_HOST=0.0.0.0'
      - 'OCR_DATA_DIR=/app/data'
      # On a volume of its own, not under OCR_DATA_DIR. Documents are encrypted with this key and
      # kept, so a key regenerated on rebuild would leave every stored document permanently
      # unreadable — and separate volumes mean a snapshot of one is useless without the other.
      - 'OCR_MASTER_KEY_FILE=/app/keys/master.key'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:8084:8080'
    volumes:
      - '../planelyx-ocr/src:/app/src'
      - 'planelyx-ocr-data:/app/data'
      - 'planelyx-ocr-keys:/app/keys'
    # Migrations run before the server binds: nobody is sitting in the ocr repo to apply them by
    # hand. --skip-backup is required rather than careless — the migration script refuses to run
    # without pg_dump, which this image does not ship, and a local container database is exactly
    # the disposable case that flag exists for.
    command: ['sh', '-c', 'yarn db:migrate --skip-backup && yarn dev']
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  planelyx-postgres-data:
  planelyx-ocr-data:
  planelyx-ocr-keys:
