spring:
  application:
    name: planelyx-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:planelyx}
    username: ${POSTGRES_USER:planelyx}
    password: ${POSTGRES_PASSWORD:planelyx}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/auth/realms/planelyx}

planelyx:
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081/auth}
    realm: ${KEYCLOAK_REALM:planelyx}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:planelyx-api-admin}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:local-dev-secret}
  provisioning:
    webhook-secret: ${PLANELYX_PROVISIONING_SECRET:local-dev-secret}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.planelyx.api: ${LOG_LEVEL:INFO}
    root: ${LOG_LEVEL_ROOT:INFO}
